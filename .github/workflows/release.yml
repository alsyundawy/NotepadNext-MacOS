name: Release New Build

on:
  push:
    tags: ["*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Qt version used for the canonical release DMG (must match one of the matrix qt_version values)
  QT_RELEASE_VER: "6.8"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ─── macOS Intel ───────────────────────────────────────────
          - runs_on: macos-15-intel
            platform: mac
            arch: x64
            cmake_arch: x86_64
            qt_arch: clang_64
            qt_version: "6.5"
            deployment_target: "11.0"

          - runs_on: macos-15-intel
            platform: mac
            arch: x64
            cmake_arch: x86_64
            qt_arch: clang_64
            qt_version: "6.8"
            deployment_target: "12.0"

          - runs_on: macos-15-intel
            platform: mac
            arch: x64
            cmake_arch: x86_64
            qt_arch: clang_64
            qt_version: "6.10"
            deployment_target: "13.0"

          - runs_on: macos-15-intel
            platform: mac
            arch: x64
            cmake_arch: x86_64
            qt_arch: clang_64
            qt_version: "6.11"
            deployment_target: "14.0"

          # ─── macOS Apple Silicon ───────────────────────────────────
          - runs_on: macos-15
            platform: mac
            arch: arm64
            cmake_arch: arm64
            qt_arch: clang_64
            qt_version: "6.5"
            deployment_target: "12.0"

          - runs_on: macos-15
            platform: mac
            arch: arm64
            cmake_arch: arm64
            qt_arch: clang_64
            qt_version: "6.8"
            deployment_target: "13.0"

          - runs_on: macos-26
            platform: mac
            arch: arm64
            cmake_arch: arm64
            qt_arch: clang_64
            qt_version: "6.10"
            deployment_target: "14.0"

          - runs_on: macos-26
            platform: mac
            arch: arm64
            cmake_arch: arm64
            qt_arch: clang_64
            qt_version: "6.11"
            deployment_target: "15.0"

    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ─── Install Qt ────────────────────────────────────────────────────
      - name: Install Qt (mac)
        if: matrix.platform == 'mac'
        uses: jdpurcell/install-qt-action@d715fb7cdd4e5661191a794764231398e2c952f2 # v5
        with:
          version: ${{ matrix.qt_version }}
          host: mac
          target: desktop
          arch: ${{ matrix.qt_arch }}
          modules: qt5compat
          cache: true

      # ─── Set DISTRIBUTION ──────────────────────────────────────────────
      - name: Set Distribution (mac)
        if: matrix.platform == 'mac'
        shell: bash
        run: echo "DISTRIBUTION=dmg" >> "$GITHUB_ENV"

      # ─── CMake Configure ───────────────────────────────────────────────
      - name: Configure (CMake)
        shell: bash
        run: |
          echo "Configure: run=$GITHUB_RUN_ID runner=${{ matrix.runs_on }} qt=${{ matrix.qt_version }} deployment=${{ matrix.deployment_target }}"
          CMAKE_OPTS=(-S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DAPP_DISTRIBUTION="${DISTRIBUTION}" -DCMAKE_OSX_DEPLOYMENT_TARGET="${{ matrix.deployment_target }}")
          if [ "${{ matrix.platform }}" = "mac" ]; then
            CMAKE_OPTS+=(-DCMAKE_OSX_ARCHITECTURES="${{ matrix.cmake_arch }}" -DMAC_ARCH_SUFFIX="${{ matrix.arch }}")
          fi
          echo "CMake options: ${CMAKE_OPTS[*]}"
          cmake "${CMAKE_OPTS[@]}"

      # ─── Build ─────────────────────────────────────────────────────────
      - name: Build
        shell: bash
        run: cmake --build build --parallel

      - name: Build MacOS Targets (dmg)
        if: matrix.platform == 'mac'
        shell: bash
        run: cmake --build build --target dmg --parallel

      # ─── Upload Artifacts ──────────────────────────────────────────────
      - name: Upload MacOS dmg
        if: matrix.platform == 'mac'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: NotepadNext-macOS-${{ matrix.arch }}-Qt${{ matrix.qt_version }}
          path: build/NotepadNext*.dmg
          if-no-files-found: warn

  # GitHub Release job — only runs on tag pushes
  github:
    name: GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build]
    if: >
      github.repository == 'alsyundawy/NotepadNext-MacOS' &&
      github.event_name == 'push' &&
      github.ref_type == 'tag'
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create or Verify Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || \
          gh release create "$RELEASE_TAG" \
            --title "$RELEASE_TAG" \
            --generate-notes

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1

      - name: Upload Release Assets
        # For each arch (x64, arm64), upload only the canonical DMG from
        # the default QT_RELEASE_VER build. The DMG is already named
        # NotepadNext-v{VERSION}-{arch}.dmg by PackagingMac.cmake, so we
        # just upload it directly — no extra zip/rename steps needed.
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          echo "=== Downloaded artifact directories ==="
          ls -la
          for arch in x64 arm64; do
            dir="NotepadNext-macOS-${arch}-Qt${QT_RELEASE_VER}"
            echo "Looking for canonical release dir: ${dir}"
            if [ -d "${dir}" ]; then
              # Find the single DMG produced by PackagingMac.cmake
              dmg_file=$(find "${dir}" -maxdepth 1 -name 'NotepadNext-v*.dmg' | head -1)
              if [ -n "${dmg_file}" ]; then
                echo "Uploading ${dmg_file} → release ${RELEASE_TAG}"
                gh release upload "${RELEASE_TAG}" "${dmg_file}" --clobber
              else
                echo "WARNING: No DMG found in ${dir}, skipping ${arch}"
              fi
            else
              echo "WARNING: Directory ${dir} not found — skipping ${arch}"
            fi
          done

      - name: Upload Default Editor Script
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [ -f "scripts/NotepadNext-Default-Editor.sh" ]; then
            echo "Uploading scripts/NotepadNext-Default-Editor.sh to release ${RELEASE_TAG}"
            gh release upload "${RELEASE_TAG}" "scripts/NotepadNext-Default-Editor.sh" --clobber
          fi
