name: Create Release Tag
run-name: Create Release Tag v${{ github.event.inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: New Version (do not include v)
        required: true

permissions:
  contents: write

jobs:
  bump-version:
    name: Bump Version and Create Tag
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Update Version in Project Files
        shell: bash
        env:
          NEW_VERSION: ${{ github.event.inputs.version }}
        run: |
          python3 -c '
          import os, re, datetime

          ver = os.environ.get("NEW_VERSION", "").strip()
          if not re.match(r"^[0-9]+(\.[0-9]+)*(-[0-9A-Za-z.]+)?$", ver):
              raise ValueError(f"Invalid semantic version string: {ver}")

          # Update CMakeLists.txt
          with open("CMakeLists.txt", "r", encoding="utf-8") as f:
              content = f.read()
          content = re.sub(r"(VERSION\s+)[^\s\)]+", rf"\g<1>{ver}", content)
          with open("CMakeLists.txt", "w", encoding="utf-8") as f:
              f.write(content)

          # Update Flatpak metadata
          meta_path = "deploy/linux/com.github.dail8859.NotepadNext.metainfo.xml"
          today = datetime.date.today().isoformat()
          entry = f"<release version=\"v{ver}\" date=\"{today}\" />"
          with open(meta_path, "r", encoding="utf-8") as f:
              xml = f.read()
          xml = xml.replace("<releases>", f"<releases>\n        {entry}")
          with open(meta_path, "w", encoding="utf-8") as f:
              f.write(xml)
          '

      - name: Commit and Tag Release
        shell: bash
        env:
          NEW_VERSION: ${{ github.event.inputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add CMakeLists.txt deploy/linux/com.github.dail8859.NotepadNext.metainfo.xml
          git commit -m "v${NEW_VERSION} release"
          git tag "v${NEW_VERSION}"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" master --tags
