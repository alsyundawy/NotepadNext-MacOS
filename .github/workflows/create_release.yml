name: Create Release
run-name: Create Release v${{ github.event.inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: New Version (do not include v)
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Update App Version
        env:
          NEW_VERSION: ${{ github.event.inputs.version }}
        run: |
          sed -i "s/^\([[:space:]]*VERSION[[:space:]]*\).*/\1${NEW_VERSION}/" CMakeLists.txt

      - name: Update Flatpak Version
        env:
          NEW_VERSION: ${{ github.event.inputs.version }}
        run: |
          RELEASE_DATE=$(date +'%Y-%m-%d')
          sed -i "s@<releases>@<releases>\n        <release version=\"v${NEW_VERSION}\" date=\"${RELEASE_DATE}\" />@" deploy/linux/com.github.dail8859.NotepadNext.metainfo.xml

      - name: Commit changes
        env:
          NEW_VERSION: ${{ github.event.inputs.version }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add CMakeLists.txt deploy/linux/com.github.dail8859.NotepadNext.metainfo.xml
          git commit -m "v${NEW_VERSION} release"

      - name: Tag commit
        env:
          NEW_VERSION: ${{ github.event.inputs.version }}
        run: |
          git tag "v${NEW_VERSION}"

      - name: Push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" master --tags
