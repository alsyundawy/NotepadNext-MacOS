name: Codespell

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  codespell:
    name: Check for spelling errors
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.1

    - uses: codespell-project/actions-codespell@master
      with:
        check_filenames: true
        path: ./src
        skip: "*.lua,*.ui"
        ignore_words_list: "doubleclick,msdos"
