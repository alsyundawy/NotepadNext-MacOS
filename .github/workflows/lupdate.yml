name: Update translation files

on: 
  workflow_dispatch:
  schedule:
    - cron: 35 1 * * 0

permissions:
  contents: write

jobs:
  lupdate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: "6.5"
          modules: qt5compat
          cache: true

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Update translations
        run: cmake --build build --target update_translations

      - name: Commit translation changes
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          commit_message: Update translation files
          file_pattern: i18n/NotepadNext_en.ts
