name: Update translation files

on:
  workflow_dispatch:
  schedule:
    - cron: 35 1 * * 0

permissions:
  contents: write

jobs:
  lupdate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: Install Qt
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: "6.5"
          modules: qt5compat
          cache: true

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Update translations
        run: cmake --build build --target update_translations

      - name: Commit translation changes
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          commit_message: Update translation files
          file_pattern: i18n/NotepadNext_en.ts
          repository_token: ${{ secrets.GITHUB_TOKEN }}
